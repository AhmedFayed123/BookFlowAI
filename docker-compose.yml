services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookflow_sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT TOP (1) 1 FROM model.sys.objects; SELECT TOP (1) 1 FROM msdb.sys.objects;" -b',
        ]
      interval: 20s
      timeout: 15s
      retries: 30
      start_period: 180s
    networks:
      - bookflow-network

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: bookflow_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ai_service:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz').read() or urllib.request.urlopen('http://localhost:8000/healthz').read()",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - bookflow-network

  webapi:
    image: bookflow-api
    container_name: bookflow_api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=BookFlowDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;MultipleActiveResultSets=true
      - AiService__BaseUrl=http://ai_service:8000
      - JwtSettings__Secret=${JWT_SECRET:-super-secret-key-please-change-this-now-12345}
      - JwtSettings__Issuer=BookFlowAI
      - JwtSettings__Audience=BookFlowAI-Clients
      - InstaPay__Recipient=${INSTAPAY_RECIPIENT:-}
      - InstaPay__ReceiptStoragePath=/app/App_Data/receipts
    volumes:
      - api_data_protection:/root/.aspnet/DataProtection-Keys
      - instapay_receipts:/app/App_Data/receipts
    depends_on:
      sqlserver:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - bookflow-network

  frontend:
    image: node:20-alpine
    container_name: bookflow_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install --prefer-offline --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_SIGNALR_URL=http://localhost:5000/hubs/bookings
      - NEXT_PUBLIC_AI_API_URL=http://localhost:5000/api
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - bookflow-network

volumes:
  sqlserver_data:
  frontend_node_modules:
  api_data_protection:
  instapay_receipts:

networks:
  bookflow-network:
    driver: bridge
